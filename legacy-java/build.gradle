plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

group = 'com.opaleye'
version = '2.4.3'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

javafx {
    version = '21.0.5'
    modules = ['javafx.controls', 'javafx.fxml', 'javafx.swing']
}

// The project keeps the original Eclipse layout: sources and resources (FXML, CSS, icon) side by side in src/.
sourceSets {
    main {
        java { srcDirs = ['src'] }
        resources {
            srcDirs = ['src']
            exclude '**/*.java'
        }
    }
    test {
        java { srcDirs = ['test'] }
    }
}

dependencies {
    // BioJava Legacy 1.9.3, shipped with the repository
    implementation files('lib/core-1.9.3.jar', 'lib/sequencing-1.9.3.jar')

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'com.opaleye.snackvar.MainStage'
}

// the application looks for ./reference and Terms_of_use.txt in the repository root
tasks.named('run') {
    workingDir = rootDir.parentFile
}

test {
    useJUnitPlatform()
}

// Runs the analysis without the user interface on a manifest of cases (see HeadlessRunner);
// used to compare results with the Python implementation: ./gradlew headless -Pmanifest=/path/to/manifest.tsv
tasks.register('headless', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.opaleye.snackvar.HeadlessRunner'
    args = [project.findProperty('manifest') ?: 'manifest.tsv']
}

tasks.register('printTestClasspath') {
    doLast { println sourceSets.test.runtimeClasspath.asPath }
}

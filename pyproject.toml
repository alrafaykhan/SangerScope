[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sangerscope"
version = "3.1.2"
description = "Sanger sequencing variant analysis with HGVS nomenclature"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "biopython>=1.80",
    "streamlit>=1.67",
    "plotly>=5.18",
    "pandas>=2.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sangerscope = "sangerscope.cli:main"

[tool.setuptools]
packages = ["sangerscope"]

[tool.setuptools.package-data]
sangerscope = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

name: Windows installer

# Builds SangerScope-<version>-Setup.exe on Windows, installs it and checks that the
# installed application runs, then publishes the installer as the release "v<version>".
on:
  push:
    tags: ["v*"]
    branches: [master]
    paths:
      - "sangerscope/**"
      - "reference/**"
      - "packaging/windows/**"
      - "pyproject.toml"
      - ".github/workflows/windows-installer.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Build installer
        shell: pwsh
        run: ./packaging/windows/build.ps1

      - name: Install silently
        shell: pwsh
        run: |
          $setup = Get-ChildItem build\windows\SangerScope-*-Setup.exe | Select-Object -First 1
          "{0:N0} MB" -f ($setup.Length / 1MB)
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\SangerScopeTest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer exit code $($p.ExitCode)" }
          if (-not (Test-Path C:\SangerScopeTest\python\python.exe)) { throw "Python runtime missing" }
          if (-not (Test-Path C:\SangerScopeTest\references.zip)) { throw "reference archive missing" }

      - name: Analyse a simulated sample with the installed application
        shell: pwsh
        run: |
          $py = "C:\SangerScopeTest\python\python.exe"
          & $py packaging\windows\smoke_test.py C:\smoke
          if ($LASTEXITCODE -ne 0) { throw "could not create test data" }
          Set-Location C:\SangerScopeTest
          & $py -m sangerscope run --ref C:\smoke\ref.fasta --fwd C:\smoke\s_F.ab1 --rev C:\smoke\s_R.ab1 --out C:\smoke\out.tsv
          if ($LASTEXITCODE -ne 0) { throw "analysis failed" }
          Get-Content C:\smoke\out.tsv
          $expected = Get-Content C:\smoke\expected.txt
          if (-not (Select-String -Path C:\smoke\out.tsv -SimpleMatch $expected)) { throw "expected variant $expected not found" }
          # the built-in references are read from the archive: a gene symbol resolves to its MANE Select transcript
          & $py -c "from sangerscope import refs; r = refs.resolve('TP53'); print(r.name, len(r.sequence)); assert len(refs.list_bundled(refs.default_reference_dir())) > 50000"
          if ($LASTEXITCODE -ne 0) { throw "built-in references are not readable" }
          & $py -m sangerscope run --ref C:\smoke\ref.fasta --fwd C:\smoke\s_F.ab1 --rev C:\smoke\s_R.ab1 --out C:\smoke\out2.tsv --report C:\smoke\report.pdf
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path C:\smoke\report.pdf)) { throw "PDF report failed" }

      - name: Download a reference from NCBI with the installed application
        continue-on-error: true
        shell: pwsh
        run: |
          $env:SANGERSCOPE_HOME = "C:\smoke\home"
          Set-Location C:\SangerScopeTest
          & "C:\SangerScopeTest\python\python.exe" -m sangerscope fetch --accession NC_045512.2 --gene N
          if ($LASTEXITCODE -ne 0) { throw "NCBI download failed" }
          Get-ChildItem C:\smoke\home\references

      - name: Start the browser interface of the installed application
        shell: pwsh
        run: |
          Set-Location C:\SangerScopeTest
          $proc = Start-Process "C:\SangerScopeTest\python\python.exe" -ArgumentList "-m","sangerscope","app","--port","8765","--no-browser" -PassThru -RedirectStandardOutput C:\smoke\app.log -RedirectStandardError C:\smoke\app.err
          $ok = $false
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 2
            try { if ((Invoke-WebRequest http://localhost:8765/_stcore/health -UseBasicParsing).StatusCode -eq 200) { $ok = $true; break } } catch {}
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          Get-Content C:\smoke\app.log, C:\smoke\app.err -ErrorAction SilentlyContinue
          if (-not $ok) { throw "the browser interface did not start" }

      - name: Install the portable package with install.ps1 and start it
        shell: pwsh
        run: |
          $zip = (Get-ChildItem build\windows\SangerScope-*-portable.zip | Select-Object -First 1).FullName
          "{0:N0} MB" -f ((Get-Item $zip).Length / 1MB)
          ./packaging/windows/install.ps1 -ZipPath $zip -InstallDir C:\PortableTest
          if (-not (Test-Path C:\PortableTest\SangerScope.bat)) { throw "launcher missing" }
          $desktop = Join-Path ([Environment]::GetFolderPath("Desktop")) "SangerScope.lnk"
          if (-not (Test-Path $desktop)) { throw "desktop shortcut missing" }
          Set-Location C:\PortableTest
          & C:\PortableTest\python\python.exe -m sangerscope --version
          if ($LASTEXITCODE -ne 0) { throw "the portable copy does not start" }
          & C:\PortableTest\python\python.exe -c "from sangerscope import refs; print(refs.resolve('BRCA2').name)"
          if ($LASTEXITCODE -ne 0) { throw "the portable copy cannot read the references" }

      - uses: actions/upload-artifact@v4
        id: upload
        with:
          name: SangerScope-Windows-Setup
          path: build/windows/SangerScope-*-Setup.exe
          if-no-files-found: error

      # Free signing through SignPath Foundation. Runs only after the project has been accepted and the
      # repository variable SIGNPATH_ORGANIZATION_ID and the secret SIGNPATH_API_TOKEN have been set
      # (see CODE_SIGNING_POLICY.md). The signed installer then replaces the unsigned one.
      - name: Sign the installer
        if: vars.SIGNPATH_ORGANIZATION_ID != '' && github.ref == 'refs/heads/master'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: SangerScope
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.upload.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: build/windows

      - name: Publish release
        if: github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $setup = Get-ChildItem build\windows\SangerScope-*-Setup.exe | Select-Object -First 1
          $version = $setup.Name -replace '^SangerScope-(.*)-Setup\.exe$', '$1'
          $tag = "v$version"
          gh release view $tag *> $null
          $portable = (Get-ChildItem build\windows\SangerScope-*-portable.zip | Select-Object -First 1).FullName
          $notes = "Windows: download $($setup.Name) and run it. Nothing else needs to be installed. The portable zip is used by the one-line PowerShell installation described in the README."
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag $setup.FullName $portable --target $env:GITHUB_SHA --title "SangerScope $version" --notes $notes
          } else {
            gh release upload $tag $setup.FullName $portable --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw "publishing the release failed" }
